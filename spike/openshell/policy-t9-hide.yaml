# T9 variant: hide repoA/.env from a READ-ONLY tree by enumerating siblings instead of the
# parent (Landlock has allow rules only, no deny). Not possible for a read-WRITE dir.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /bin, /etc, /proc, /dev/urandom, /hostdev/repoB, /hostdev/repoA/README]
  read_write: [/tmp, /dev/null]
landlock:
  compatibility: hard_requirement
