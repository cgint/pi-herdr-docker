# Herdr-in-Docker: headless herdr server owning N pi-agent panes.
#
# Single-instance workflow (the common case):
#   ./herdr.sh up              # build + start
#   ./herdr.sh attach          # TUI via docker exec
#   ./herdr.sh down            # stop + remove
#
# Multi-instance (N containers) is handled by herdr.sh via `docker run`
# directly — see the script for details. This compose file is the
# single-instance recipe.
#
# Herdr's session state lives in a Docker named volume (unix sockets and
# atomic file writes don't work on macOS bind mounts). Pi state (~/.pi)
# is read-write via bind mount.

name: pi-agent-herdr

services:
  herdr:
    build:
      context: .
      dockerfile: Dockerfile.herdr
    image: pi-agent-herdr:node22
    container_name: pi-agent-herdr
    tty: true
    init: true
    ports:
      - "2222:22"
    volumes:
      - ${HOME}/.pi:/pi
      - ./herdr-config.toml:/opt/herdr-config.toml:ro
      - herdr-state:/root/.config/herdr
      - ${WORKDIR_REPO:-.}:/workspace/current-repo
      - ${HOME}/.ssh:/host-ssh:ro
    environment:
      - PI_CODING_AGENT_DIR=/pi/profiles/${PROFILE:-minimal}/agent
      - UV_CACHE_DIR=/tmp/uv-cache
      - XDG_CACHE_HOME=/tmp/xdg-cache
      - XDG_DATA_HOME=/tmp/xdg-data
      - PATH=/usr/local/bin:/usr/bin:/bin
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLA_BASE_URL=${OLLA_BASE_URL:-http://host.docker.internal:40114}

volumes:
  herdr-state:
