# Sandbox policy for the pluto spike (T2a-T6, T9). /dev/ptmx + /dev/pts are needed for herdr panes.
# Filesystem/landlock/process are fixed at creation; network_policies are live (openshell policy update / set).
version: 1

filesystem_policy:
  include_workdir: true            # /sandbox (workspace + $HOME) read-write
  read_only:
    - /usr
    - /lib
    - /bin
    - /etc
    - /proc
    - /dev/urandom
    - /var/log
    - /hostro
    - /hostdev                     # T9: host "~/dev" stand-in, read-only by policy...
  read_write:
    - /tmp
    - /dev/null
    - /dev/ptmx                    # T6: herdr panes need openpty()
    - /dev/pts
    - /dev/tty
    - /hostdev/repoA               # ...except one repo (nested rw inside ro)

landlock:
  compatibility: hard_requirement  # default best_effort would run WITHOUT fs rules on failure

network_policies:
  home_llm:                        # T2a: only node (pi) may reach the LAN LLM gateway
    endpoints:
      - host: pluto
        port: 40115
    binaries:
      - path: /usr/bin/node
