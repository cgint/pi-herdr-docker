# UC2: git push from a sandbox with NO host mounts; the GitHub PAT stays on the host.
# The sandbox sees only a placeholder in GITHUB_TOKEN. git sends it as the password in
# "Authorization: Basic base64(x-access-token:<placeholder>)" (via a credential helper);
# the proxy decodes, swaps in the real token, re-encodes. Scoped to ONE repo, git only.
# Adapted from NVIDIA's providers/github.yaml (Apache-2.0) + github-push-access tutorial.
id: uc2-github-push
display_name: GitHub push (uc2 spike)
description: git smart-HTTP clone/fetch/push to cgint/pi-herdr-docker only
category: source_control
credentials:
  - name: api_token
    description: Fine-grained PAT (contents rw, one repo)
    env_vars: [GITHUB_TOKEN]
    required: true
    auth_style: basic
    header_name: authorization
discovery:
  credentials: [api_token]
endpoints:
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET,  path: "/cgint/pi-herdr-docker.git/info/refs*" }
      - allow: { method: POST, path: "/cgint/pi-herdr-docker.git/git-upload-pack" }
      - allow: { method: POST, path: "/cgint/pi-herdr-docker.git/git-receive-pack" }
binaries: [/usr/bin/git]
